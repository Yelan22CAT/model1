name: Bridge v0.20 Security Triage Candidate
on:
  pull_request:
    paths:
      - 'experiments/human-ai-bridge-language/security_triage_v0_20/**'
      - '.github/workflows/bridge_v020_security_triage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.5'
      - name: Check Python syntax
        working-directory: experiments/human-ai-bridge-language/security_triage_v0_20
        run: python -m py_compile security_triage_v0_20.py test_security_triage_v0_20.py
      - name: Run deterministic/negative tests
        working-directory: experiments/human-ai-bridge-language/security_triage_v0_20
        run: python -m unittest -v test_security_triage_v0_20.py
      - name: Check fail-closed demo
        working-directory: experiments/human-ai-bridge-language/security_triage_v0_20
        run: |
          python security_triage_v0_20.py triage_demo_v0_20.bridge --context triage_context_sample.json > result.json
          python -c "import json; r=json.load(open('result.json')); assert r['disposition']=='hold_unknown_or_untrusted'; assert r['execution_allowed'] is False; assert r['may_publish_safe_claim'] is False"
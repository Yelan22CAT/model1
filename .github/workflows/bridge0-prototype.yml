name: Bridge-0 prototype checks

on:
  push:
    branches:
      - experiment/human-ai-bridge-v0.1
    paths:
      - "experiments/human-ai-bridge-language/**"
      - ".github/workflows/bridge0-prototype.yml"
  pull_request:
    paths:
      - "experiments/human-ai-bridge-language/**"
      - ".github/workflows/bridge0-prototype.yml"

permissions:
  contents: read

jobs:
  parser-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        working-directory: experiments/human-ai-bridge-language/prototype
        run: python -m py_compile parser_v0_2.py validator_v0_2.py renderer_v0_2.py bridge_check_v0_2.py test_parser_v0_2.py test_validator_v0_2.py test_roundtrip_v0_2.py

      - name: Unit tests
        working-directory: experiments/human-ai-bridge-language/prototype
        run: python -m unittest -v test_parser_v0_2.py test_validator_v0_2.py test_roundtrip_v0_2.py


      - name: End-to-end demo
        working-directory: experiments/human-ai-bridge-language/prototype
        run: |
          python bridge_check_v0_2.py < ../demo_v0.2.bridge > /tmp/bridge0-demo.json
          python - <<'PY'
          import json
          with open("/tmp/bridge0-demo.json", "r", encoding="utf-8") as f:
              result = json.load(f)
          assert result["stage"] == "validate"
          assert result["validation"]["valid"] is True
          print("Bridge-0 demo parse + validation: OK")
          PY

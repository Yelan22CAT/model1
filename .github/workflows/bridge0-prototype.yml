name: Bridge-0 prototype checks

on:
  push:
    branches:
      - experiment/human-ai-bridge-v0.1
    paths:
      - "experiments/human-ai-bridge-language/**"
      - ".github/workflows/bridge0-prototype.yml"
  pull_request:
    paths:
      - "experiments/human-ai-bridge-language/**"
      - ".github/workflows/bridge0-prototype.yml"

permissions:
  contents: read

jobs:
  parser-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node for cross-language tests
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax check
        working-directory: experiments/human-ai-bridge-language/prototype
        run: python -m py_compile parser_v0_2.py validator_v0_2.py renderer_v0_2.py bridge_check_v0_2.py parser_v0_3.py validator_v0_3.py renderer_v0_3.py bridge_check_v0_3.py authority_engine_v0_4.py parser_v0_4.py validator_v0_4.py renderer_v0_4.py bridge_check_v0_4.py parser_v0_5.py validator_v0_5.py renderer_v0_5.py bridge_check_v0_5.py parser_v0_6.py validator_v0_6.py renderer_v0_6.py bridge_check_v0_6.py parser_v0_7.py validator_v0_7.py renderer_v0_7.py bridge_check_v0_7.py parser_v0_8.py validator_v0_8.py renderer_v0_8.py compiler_github_v0_8.py bridge_compile_v0_8.py parser_v0_9.py validator_v0_9.py renderer_v0_9.py compiler_github_v0_9.py bridge_compile_v0_9.py local_runner_v0_9.py compare_observables_v0_9.py bridge_probe_v0_9.py parser_v0_10.py validator_v0_10.py renderer_v0_10.py compiler_github_v0_10.py bridge_compile_v0_10.py backend_capture_v0_10.py compare_typed_observables_v0_10.py bridge_probe_v0_10.py parser_v0_11.py validator_v0_11.py renderer_v0_11.py compiler_crosslang_v0_11.py bridge_compile_v0_11.py parser_v0_12.py validator_v0_12.py renderer_v0_12.py compiler_exact_integer_v0_12.py bridge_compile_v0_12.py parser_v0_13.py validator_v0_13.py renderer_v0_13.py compiler_float_v0_13.py bridge_compile_v0_13.py parser_v0_14.py validator_v0_14.py renderer_v0_14.py compiler_unicode_v0_14.py bridge_compile_v0_14.py parser_v0_15.py validator_v0_15.py renderer_v0_15.py compiler_grapheme_v0_15.py bridge_compile_v0_15.py test_parser_v0_2.py test_validator_v0_2.py test_roundtrip_v0_2.py test_semantic_mutation_v0_2.py test_structured_semantics_v0_3.py test_authority_drift_v0_3.py test_authority_lifecycle_v0_4.py test_split_brain_v0_5.py test_conflict_set_quorum_v0_6.py test_identity_provenance_v0_7.py test_compiler_v0_8.py test_backend_equivalence_v0_9.py test_heterogeneous_v0_10.py test_cross_language_v0_11.py test_exact_integer_v0_12.py test_float_semantics_v0_13.py test_unicode_semantics_v0_14.py test_grapheme_semantics_v0_15.py

      - name: Unit tests
        working-directory: experiments/human-ai-bridge-language/prototype
        run: python -m unittest -v test_parser_v0_2.py test_validator_v0_2.py test_roundtrip_v0_2.py test_semantic_mutation_v0_2.py test_structured_semantics_v0_3.py test_authority_drift_v0_3.py test_authority_lifecycle_v0_4.py test_split_brain_v0_5.py test_conflict_set_quorum_v0_6.py test_identity_provenance_v0_7.py test_compiler_v0_8.py test_backend_equivalence_v0_9.py test_heterogeneous_v0_10.py test_cross_language_v0_11.py test_exact_integer_v0_12.py test_float_semantics_v0_13.py test_unicode_semantics_v0_14.py


      - name: End-to-end demo
        working-directory: experiments/human-ai-bridge-language/prototype
        run: |
          python bridge_check_v0_2.py < ../demo_v0.2.bridge > /tmp/bridge0-demo.json
          python - <<'PY'
          import json
          with open("/tmp/bridge0-demo.json", "r", encoding="utf-8") as f:
              result = json.load(f)
          assert result["stage"] == "validate"
          assert result["validation"]["valid"] is True
          print("Bridge-0 demo parse + validation: OK")
          PY


      - name: End-to-end v0.3 composed workflow
        working-directory: experiments/human-ai-bridge-language/prototype
        run: |
          python bridge_check_v0_3.py < ../demo_v0.3.bridge > /tmp/bridge0-v03-demo.json
          python - <<'PY'
          import json
          with open("/tmp/bridge0-v03-demo.json", "r", encoding="utf-8") as f:
              result = json.load(f)
          assert result["stage"] == "validate"
          assert result["validation"]["valid"] is True
          kinds = [s["kind"] for s in result["ir"]["statements"]]
          assert "permission" in kinds
          assert "handoff" in kinds
          assert "provenance" in kinds
          assert "state_transition" in kinds
          print("Bridge-0 v0.3 composed authority/provenance demo: OK")
          PY


      - name: End-to-end v0.5 split-brain reconciliation
        working-directory: experiments/human-ai-bridge-language/prototype
        run: |
          python bridge_check_v0_5.py < ../demo_v0.5.bridge > /tmp/bridge0-v05-demo.json
          python - <<'PY'
          import json
          with open("/tmp/bridge0-v05-demo.json", "r", encoding="utf-8") as f:
              result = json.load(f)
          assert result["stage"] == "validate"
          assert result["validation"]["valid"] is True
          kinds = [s["kind"] for s in result["ir"]["statements"]]
          assert "snapshot" in kinds
          assert "split_brain_conflict" in kinds
          assert "merge" in kinds
          assert "finality" in kinds
          assert "execution" in kinds
          print("Bridge-0 v0.5 split-brain reconciliation demo: OK")
          PY


      - name: End-to-end v0.6 conflict-set quorum
        working-directory: experiments/human-ai-bridge-language/prototype
        run: |
          python bridge_check_v0_6.py < ../demo_v0.6.bridge > /tmp/bridge0-v06-demo.json
          python - <<'PY'
          import json
          with open("/tmp/bridge0-v06-demo.json", "r", encoding="utf-8") as f:
              result = json.load(f)
          assert result["stage"] == "validate"
          assert result["validation"]["valid"] is True
          kinds = [s["kind"] for s in result["ir"]["statements"]]
          assert "conflict_set" in kinds
          assert "reconciliation_proposal" in kinds
          assert "quorum_policy" in kinds
          assert "vote" in kinds
          assert "finality_certificate" in kinds
          print("Bridge-0 v0.6 conflict-set quorum demo: OK")
          PY


      - name: End-to-end v0.7 attested independence
        working-directory: experiments/human-ai-bridge-language/prototype
        run: |
          python bridge_check_v0_7.py < ../demo_v0.7.bridge > /tmp/bridge0-v07-demo.json
          python - <<'PY'
          import json
          with open("/tmp/bridge0-v07-demo.json", "r", encoding="utf-8") as f:
              result = json.load(f)
          assert result["stage"] == "validate"
          assert result["validation"]["valid"] is True
          kinds = [s["kind"] for s in result["ir"]["statements"]]
          assert "identity" in kinds
          assert "identity_attestation" in kinds
          assert "evidence_provenance" in kinds
          assert "finality_certificate" in kinds
          print("Bridge-0 v0.7 attested independence demo: OK")
          PY


      - name: End-to-end v0.8 Bridge source compiler
        working-directory: experiments/human-ai-bridge-language/prototype
        run: |
          python bridge_compile_v0_8.py < ../executable_v0.8.bridge > /tmp/bridge0-generated-v08.yml
          diff -u /tmp/bridge0-generated-v08.yml ../../../.github/workflows/bridge0-generated-v08.yml
          echo "Bridge-0 v0.8 source -> GitHub Actions compile: OK"


      - name: End-to-end v0.9 multi-backend compiler
        working-directory: experiments/human-ai-bridge-language/prototype
        run: |
          python bridge_compile_v0_9.py < ../executable_v0.9.bridge > /tmp/bridge0-generated-v09.yml
          diff -u /tmp/bridge0-generated-v09.yml ../../../.github/workflows/bridge0-generated-v09.yml
          python local_runner_v0_9.py ../executable_v0.9.bridge
          python compare_observables_v0_9.py .bridge-local-T3.stdout .bridge-local-T3.stdout
          echo "Bridge-0 v0.9 multi-backend compile/local check: OK"


      - name: v0.9 backend drift negative control
        working-directory: experiments/human-ai-bridge-language/prototype
        run: |
          printf 'backend-A\n' > /tmp/bridge-backend-a.txt
          printf 'backend-B\n' > /tmp/bridge-backend-b.txt
          if python compare_observables_v0_9.py /tmp/bridge-backend-a.txt /tmp/bridge-backend-b.txt; then
            echo "Comparator failed to detect backend drift"
            exit 1
          fi
          echo "Bridge-0 v0.9 negative control: backend drift detected as expected"


      - name: End-to-end v0.10 heterogeneous compiler
        working-directory: experiments/human-ai-bridge-language/prototype
        run: |
          python bridge_compile_v0_10.py < ../executable_v0.10.bridge > /tmp/bridge0-generated-v010.yml
          diff -u /tmp/bridge0-generated-v010.yml ../../../.github/workflows/bridge0-generated-v010.yml
          echo "Bridge-0 v0.10 heterogeneous compile check: OK"

      - name: v0.10 typed semantic negative control
        working-directory: experiments/human-ai-bridge-language/prototype
        run: |
          printf '{"result":42,"state":{"ready":true}}\n' > /tmp/bridge-v010-a.json
          printf '{"state":{"ready":true},"result":43}\n' > /tmp/bridge-v010-b.json
          if python compare_typed_observables_v0_10.py /tmp/bridge-v010-a.json /tmp/bridge-v010-b.json; then
            echo "Typed comparator failed to detect semantic drift"
            exit 1
          fi
          echo "Bridge-0 v0.10 negative control: typed semantic drift detected as expected"


      - name: End-to-end v0.11 cross-language compiler
        working-directory: experiments/human-ai-bridge-language/prototype
        run: |
          python bridge_compile_v0_11.py --target python312 < ../executable_v0.11.bridge > /tmp/bridge-v011.py
          python bridge_compile_v0_11.py --target node20 < ../executable_v0.11.bridge > /tmp/bridge-v011.mjs
          diff -u /tmp/bridge-v011.py ../generated/generated_v0_11.py
          diff -u /tmp/bridge-v011.mjs ../generated/generated_v0_11.mjs
          python /tmp/bridge-v011.py > /tmp/bridge-v011-python.json
          node /tmp/bridge-v011.mjs > /tmp/bridge-v011-node.json
          python compare_typed_observables_v0_10.py /tmp/bridge-v011-python.json /tmp/bridge-v011-node.json
          echo "Bridge-0 v0.11 Python/Node semantic equivalence: OK"

      - name: v0.11 cross-language drift negative control
        working-directory: experiments/human-ai-bridge-language/prototype
        run: |
          python bridge_compile_v0_11.py --target python312 < ../executable_v0.11.bridge > /tmp/bridge-v011.py
          python /tmp/bridge-v011.py > /tmp/bridge-v011-good.json
          printf '{"count":6,"max":13,"min":2,"sum":42}\n' > /tmp/bridge-v011-mutated.json
          if python compare_typed_observables_v0_10.py /tmp/bridge-v011-good.json /tmp/bridge-v011-mutated.json; then
            echo "Cross-language comparator failed to detect semantic drift"
            exit 1
          fi
          echo "Bridge-0 v0.11 negative control: cross-language drift detected as expected"


      - name: End-to-end v0.12 exact-integer compiler
        working-directory: experiments/human-ai-bridge-language/prototype
        run: |
          python bridge_compile_v0_12.py --target python312 < ../executable_v0.12.bridge > /tmp/bridge-v012.py
          python bridge_compile_v0_12.py --target node20 < ../executable_v0.12.bridge > /tmp/bridge-v012.mjs
          diff -u /tmp/bridge-v012.py ../generated/generated_v0_12.py
          diff -u /tmp/bridge-v012.mjs ../generated/generated_v0_12.mjs
          python /tmp/bridge-v012.py > /tmp/bridge-v012-python.json
          node /tmp/bridge-v012.mjs > /tmp/bridge-v012-node.json
          python compare_typed_observables_v0_10.py /tmp/bridge-v012-python.json /tmp/bridge-v012-node.json
          echo "Bridge-0 v0.12 exact-integer Python/Node equivalence: OK"

      - name: v0.12 unsafe backend negative control
        working-directory: experiments/human-ai-bridge-language/prototype
        run: |
          python - <<'PY'
          from pathlib import Path
          from parser_v0_12 import parse_document
          from compiler_exact_integer_v0_12 import compile_unsafe_node_number
          source = Path("../executable_v0.12.bridge").read_text(encoding="utf-8")
          Path("/tmp/bridge-v012-unsafe.mjs").write_text(
              compile_unsafe_node_number(parse_document(source)),
              encoding="utf-8",
          )
          PY
          python /tmp/bridge-v012.py > /tmp/bridge-v012-good.json
          node /tmp/bridge-v012-unsafe.mjs > /tmp/bridge-v012-unsafe.json
          if python compare_typed_observables_v0_10.py /tmp/bridge-v012-good.json /tmp/bridge-v012-unsafe.json; then
            echo "Unsafe JavaScript Number backend incorrectly matched exact_integer semantics"
            exit 1
          fi
          echo "Bridge-0 v0.12 negative control: backend numeric drift detected as expected"


      - name: End-to-end v0.13 floating semantic compiler
        working-directory: experiments/human-ai-bridge-language/prototype
        run: |
          python bridge_compile_v0_13.py --target python312 < ../executable_v0.13.bridge > /tmp/bridge-v013.py
          python bridge_compile_v0_13.py --target node20 < ../executable_v0.13.bridge > /tmp/bridge-v013.mjs
          diff -u /tmp/bridge-v013.py ../generated/generated_v0_13.py
          diff -u /tmp/bridge-v013.mjs ../generated/generated_v0_13.mjs
          python /tmp/bridge-v013.py > /tmp/bridge-v013-python.json
          node /tmp/bridge-v013.mjs > /tmp/bridge-v013-node.json
          python compare_typed_observables_v0_10.py /tmp/bridge-v013-python.json /tmp/bridge-v013-node.json
          echo "Bridge-0 v0.13 binary64 Python/Node equivalence: OK"

      - name: v0.13 backend-default float negative control
        working-directory: experiments/human-ai-bridge-language/prototype
        run: |
          python - <<'PY'
          from pathlib import Path
          from parser_v0_13 import parse_document
          from compiler_float_v0_13 import compile_unsafe_node_defaults
          source = Path("../executable_v0.13.bridge").read_text(encoding="utf-8")
          Path("/tmp/bridge-v013-unsafe.mjs").write_text(
              compile_unsafe_node_defaults(parse_document(source)),
              encoding="utf-8",
          )
          PY
          python /tmp/bridge-v013.py > /tmp/bridge-v013-good.json

          if python compare_typed_observables_v0_10.py /tmp/bridge-v013-good.json /tmp/bridge-v013-unsafe.json; then
            echo "Unsafe backend-default float semantics incorrectly matched Bridge contract"
            exit 1
          fi
          echo "Bridge-0 v0.13 negative control: float semantic drift detected as expected"


      - name: End-to-end v0.14 Unicode semantic compiler
        working-directory: experiments/human-ai-bridge-language/prototype
        run: |
          python bridge_compile_v0_14.py --target python312 < ../executable_v0.14.bridge > /tmp/bridge-v014.py
          python bridge_compile_v0_14.py --target node20 < ../executable_v0.14.bridge > /tmp/bridge-v014.mjs
          diff -u /tmp/bridge-v014.py ../generated/generated_v0_14.py
          diff -u /tmp/bridge-v014.mjs ../generated/generated_v0_14.mjs
          python /tmp/bridge-v014.py > /tmp/bridge-v014-python.json
          node /tmp/bridge-v014.mjs > /tmp/bridge-v014-node.json
          python compare_typed_observables_v0_10.py /tmp/bridge-v014-python.json /tmp/bridge-v014-node.json
          echo "Bridge-0 v0.14 Unicode Python/Node equivalence: OK"

      - name: v0.14 raw-text identity negative control
        working-directory: experiments/human-ai-bridge-language/prototype
        run: |
          python - <<'PY'
          from pathlib import Path
          from parser_v0_14 import parse_document
          from compiler_unicode_v0_14 import compile_unsafe_node_raw
          source = Path("../executable_v0.14.bridge").read_text(encoding="utf-8")
          Path("/tmp/bridge-v014-unsafe.mjs").write_text(
              compile_unsafe_node_raw(parse_document(source)),
              encoding="utf-8",
          )
          PY
          python /tmp/bridge-v014.py > /tmp/bridge-v014-good.json
          node /tmp/bridge-v014-unsafe.mjs > /tmp/bridge-v014-unsafe.json
          if python compare_typed_observables_v0_10.py /tmp/bridge-v014-good.json /tmp/bridge-v014-unsafe.json; then
            echo "Unsafe raw text identity incorrectly matched NFC semantics"
            exit 1
          fi
          echo "Bridge-0 v0.14 negative control: Unicode identity drift detected as expected"


      - name: End-to-end v0.15 grapheme semantic compiler
        working-directory: experiments/human-ai-bridge-language/prototype
        run: |
          python bridge_compile_v0_15.py --target python312 < ../executable_v0.15.bridge > /tmp/bridge-v015.py
          python bridge_compile_v0_15.py --target node20 < ../executable_v0.15.bridge > /tmp/bridge-v015.mjs
          diff -u /tmp/bridge-v015.py ../generated/generated_v0_15.py
          diff -u /tmp/bridge-v015.mjs ../generated/generated_v0_15.mjs
          python /tmp/bridge-v015.py > /tmp/bridge-v015-python.json
          node /tmp/bridge-v015.mjs > /tmp/bridge-v015-node.json
          python compare_typed_observables_v0_10.py /tmp/bridge-v015-python.json /tmp/bridge-v015-node.json
          echo "Bridge-0 v0.15 grapheme Python/Node equivalence: OK"

      - name: v0.15 code-point segmentation negative control
        working-directory: experiments/human-ai-bridge-language/prototype
        run: |
          python - <<'PY'
          from pathlib import Path
          from parser_v0_15 import parse_document
          from compiler_grapheme_v0_15 import compile_unsafe_node_codepoints
          source = Path("../executable_v0.15.bridge").read_text(encoding="utf-8")
          Path("/tmp/bridge-v015-unsafe.mjs").write_text(
              compile_unsafe_node_codepoints(parse_document(source)),
              encoding="utf-8",
          )
          PY
          python /tmp/bridge-v015.py > /tmp/bridge-v015-good.json
          node /tmp/bridge-v015-unsafe.mjs > /tmp/bridge-v015-unsafe.json
          if python compare_typed_observables_v0_10.py /tmp/bridge-v015-good.json /tmp/bridge-v015-unsafe.json; then
            echo "Unsafe code-point segmentation incorrectly matched grapheme semantics"
            exit 1
          fi
          echo "Bridge-0 v0.15 negative control: grapheme drift detected as expected"

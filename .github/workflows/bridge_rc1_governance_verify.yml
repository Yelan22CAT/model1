name: Bridge RC1 Governance Verification

on:
  push:
    branches: [main]
    paths:
      - 'governance/**'
      - '.github/workflows/bridge_rc1_governance_verify.yml'
  pull_request:
    branches: [main]
    paths:
      - 'governance/**'
      - '.github/workflows/bridge_rc1_governance_verify.yml'
      - 'experiments/human-ai-bridge-language/SPEC_v1.0-rc1.md'
      - 'experiments/human-ai-bridge-language/COMPATIBILITY_v1.0-rc1.md'
      - 'experiments/human-ai-bridge-language/INVARIANTS_RC1.json'
      - 'experiments/human-ai-bridge-language/RC_QUALIFICATION_v1.0-rc1.md'
      - 'experiments/human-ai-bridge-language/public_repro_rc1/**'
      - '.github/workflows/bridge_rc1_public_repro.yml'

permissions:
  contents: read

jobs:
  verify-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'

      - name: Verify current material projection
        run: python3 governance/verify_bridge_rc1_projection_v11.py

      - name: Verify evidence execution profile
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 governance/verify_bridge_rc1_execution_profile.py
